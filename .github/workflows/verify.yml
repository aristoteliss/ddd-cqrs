name: Verification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, every workspace's tests, the build and the packed-consumer release check.
  # 22.17.0 is the lowest Node.js the whole workspace installs on: @cqrs-ddd/mikro-orm
  # follows its MikroORM peer.
  verify:
    name: Verify (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.17.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      # Workspaces import their sibling packages from dist.
      - run: pnpm build
      - run: pnpm verify:all

  # The packages on the Node.js their manifests declare as the minimum. pnpm 11 does not
  # run on 22.12.0, so a newer Node.js installs and builds and the tests run without pnpm.
  # domain-entry-point.spec.ts traces imports with module.registerHooks, which Node.js
  # 22.15 added; the verify job runs it.
  minimum-node:
    name: Package tests (Node.js 22.12.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      - name: Test every package but mikro-orm, and the plain Node.js examples
        run: |
          node --version
          for package in packages/*/; do
            if [ "$package" = "packages/mikro-orm/" ]; then continue; fi
            (cd "$package" && ./node_modules/.bin/vitest run --coverage.enabled=false \
              --exclude "**/domain-entry-point.spec.ts")
          done
          cd integration && node --test "plain-node/*.test.mjs"

  # The example application over HTTP on Express and Fastify, against throwaway
  # databases and Testcontainers. Not part of verify:all.
  e2e:
    name: End to end (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
